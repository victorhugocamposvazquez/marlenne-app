<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Entrar · Marlén</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f6f6f8;
      color: #0f0e1a;
      padding: 24px;
    }
    .card { max-width: 320px; text-align: center; }
    p { font-size: 14px; line-height: 1.45; color: #5c5a6e; margin: 0 0 16px; }
    p.lead { font-size: 15px; font-weight: 600; color: #0f0e1a; }
    button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: #f4487f;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <p>Preparando sesión…</p>
  </div>
  <script>
    (function () {
      var root = document.getElementById('root');
      var q = new URLSearchParams(location.search);
      var token = (q.get('t') || '').trim();
      var EMBED_KEY = 'marlenne_embed_panel';

      function enterUrl() {
        if (!token) return null;
        return '/ops/enter?t=' + encodeURIComponent(token) + '&embed=1';
      }

      function setHtml(html) {
        root.innerHTML = html;
      }

      function goEnter() {
        var url = enterUrl();
        if (!url) return;
        location.replace(url);
      }

      if (!token) {
        setHtml('<p class="lead">Enlace incompleto</p><p>Vuelve a abrir modo soporte en el panel.</p>');
        return;
      }

      try { sessionStorage.setItem(EMBED_KEY, '1'); } catch (e) {}

      if (window.self === window.top) {
        goEnter();
        return;
      }

      var hasApi = typeof document.hasStorageAccess === 'function'
        && typeof document.requestStorageAccess === 'function';

      if (!hasApi) {
        goEnter();
        return;
      }

      document.hasStorageAccess().then(function (has) {
        if (has) {
          goEnter();
          return;
        }
        setHtml(
          '<p class="lead">Un toque para ver la app dentro del panel</p>'
          + '<p>Safari pide confirmación para cookies en iframe.</p>'
          + '<button type="button" id="go">Entrar en la app del centro</button>'
        );
        document.getElementById('go').onclick = function () {
          var btn = this;
          btn.disabled = true;
          btn.textContent = 'Entrando…';
          Promise.resolve()
            .then(function () { return document.requestStorageAccess(); })
            .catch(function () {})
            .then(goEnter);
        };
      }).catch(function () {
        goEnter();
      });
    })();
  </script>
</body>
</html>
